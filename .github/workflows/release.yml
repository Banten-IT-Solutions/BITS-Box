name: '🏷️ Release Build'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag'
        required: true
      publish:
        description: "Publish: 'y' to publish a GitHub release"
        required: false
      play:
        description: "Play: 'y' to also build the Play AAB"
        required: false

jobs:
  libcore:
    name: '🔧 Native Build (LibCore)'
    runs-on: ubuntu-latest
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v6

      - name: '☕ Setup JDK 21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: '🤖 Setup Android SDK & NDK'
        uses: android-actions/setup-android@v4

      - name: '📦 Install NDK'
        run: sdkmanager --install "ndk;29.0.14206865" --channel=0

      - name: '📂 Fetch pinned native sources'
        run: bash buildScript/lib/core/get_source.sh

      - name: '🔍 Golang Status'
        run: find buildScript libcore/*.sh libcore/go.mod libcore/go.sum | xargs cat | sha1sum > golang_status

      - name: '📊 Libcore Status'
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: '🌐 External Status'
        run: |
          git -C external/sing-box rev-parse HEAD > deps_status
          git -C external/bits-box-core rev-parse HEAD >> deps_status
          git ls-remote https://github.com/bitscoid/gomobile.git refs/heads/master >> deps_status

      - name: '💾 Cache LibCore AAR'
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/bitscore.aar
          key: bitscore-${{ runner.os }}-${{ hashFiles('buildScript/lib/core/*.sh', 'libcore/**') }}

      - name: '🐹 Setup Go'
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '^1.25'

      - name: '🔧 Init Go Mobile'
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash buildScript/lib/core/init.sh

      - name: '🏗️ Build LibCore'
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash buildScript/lib/core/build.sh

      - name: '📤 Upload LibCore AAR'
        uses: actions/upload-artifact@v6
        with:
          name: bitscore-aar
          path: app/libs/bitscore.aar

  build:
    name: '📦 Build BITS Box APK'
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v6

      - name: '☕ Setup JDK 21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: '🤖 Setup Android SDK & NDK'
        uses: android-actions/setup-android@v4

      - name: '📦 Install NDK'
        run: sdkmanager --install "ndk;29.0.14206865" --channel=0

      - name: '📂 Fetch pinned native sources'
        run: bash buildScript/lib/core/get_source.sh

      - name: '🔍 Golang Status'
        run: find buildScript libcore/*.sh libcore/go.mod libcore/go.sum | xargs cat | sha1sum > golang_status

      - name: '📊 Libcore Status'
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: '🌐 External Status'
        run: |
          git -C external/sing-box rev-parse HEAD > deps_status
          git -C external/bits-box-core rev-parse HEAD >> deps_status
          git ls-remote https://github.com/bitscoid/gomobile.git refs/heads/master >> deps_status

      - name: '📥 Restore LibCore AAR'
        uses: actions/download-artifact@v7
        with:
          name: bitscore-aar
          path: app/libs

      - name: '🔑 Restore Keystore'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: '💾 Gradle Cache'
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}

      - name: '🔢 Set Version & Bump Code'
        run: |
          VERSION_NAME="${{ github.event.inputs.tag }}"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$VERSION_NAME/" bitsbox.properties
          sed -i "s/^PRE_VERSION_NAME=.*/PRE_VERSION_NAME=pre-$VERSION_NAME-$(date +%Y%m%d)/" bitsbox.properties
          OLD_CODE=$(grep "^VERSION_CODE=" bitsbox.properties | cut -d= -f2)
          NEW_CODE=$((OLD_CODE + 1))
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=$NEW_CODE/" bitsbox.properties
          echo "Updated to VERSION_NAME=$VERSION_NAME VERSION_CODE=$NEW_CODE"

      - name: '🏗️ Gradle Build'
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865
          ./run init action gradle
          ./gradlew app:assembleOssRelease
          apk_dir=app/build/outputs/apk/oss/release
          mkdir -p artifacts/v7 artifacts/v8
          cp "$apk_dir"/*armeabi-v7a*.apk artifacts/v7/
          cp "$apk_dir"/*arm64-v8a*.apk artifacts/v8/

      - name: '📤 Upload Release v7'
        uses: actions/upload-artifact@v6
        with:
          name: release-v7
          path: artifacts/v7/*.apk

      - name: '📤 Upload Release v8'
        uses: actions/upload-artifact@v6
        with:
          name: release-v8
          path: artifacts/v8/*.apk

  publish:
    name: '🚀 Publish Release'
    if: github.event.inputs.publish == 'y'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v6

      - name: '📦 Download Artifacts'
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: '📢 Create GitHub Release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          gh release delete "${{ github.event.inputs.tag }}" --yes 2>/dev/null || true
          gh release create "${{ github.event.inputs.tag }}" \
            --title "${{ github.event.inputs.tag }}" \
            --generate-notes \
            artifacts/release-v7/*.apk \
            artifacts/release-v8/*.apk

  play:
    name: '🎮 Build Play Bundle'
    if: github.event.inputs.play == 'y'
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@v6

      - name: '☕ Setup JDK 21'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: '🤖 Setup Android SDK & NDK'
        uses: android-actions/setup-android@v4

      - name: '📦 Install NDK'
        run: sdkmanager --install "ndk;29.0.14206865" --channel=0

      - name: '📂 Fetch pinned native sources'
        run: bash buildScript/lib/core/get_source.sh

      - name: '🔍 Golang Status'
        run: find buildScript libcore/*.sh libcore/go.mod libcore/go.sum | xargs cat | sha1sum > golang_status

      - name: '📊 Libcore Status'
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status

      - name: '🌐 External Status'
        run: |
          git -C external/sing-box rev-parse HEAD > deps_status
          git -C external/bits-box-core rev-parse HEAD >> deps_status
          git ls-remote https://github.com/bitscoid/gomobile.git refs/heads/master >> deps_status

      - name: '📥 Restore LibCore AAR'
        uses: actions/download-artifact@v7
        with:
          name: bitscore-aar
          path: app/libs

      - name: '🔑 Restore Keystore'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: '💾 Gradle Cache'
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-play-${{ hashFiles('**/*.gradle.kts') }}

      - name: '🏗️ Gradle Build (AAB)'
        env:
          BUILD_PLUGIN: none
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865
          ./run init action gradle
          ./gradlew bundlePlayRelease

      - name: '📤 Upload AAB'
        uses: actions/upload-artifact@v6
        with:
          name: AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
