name: 🚀 Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 🌐 Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v6
      - name: 📦 Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v5
