version: 2
updates:
  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '02:30'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps):'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # ── Gradle (app + buildSrc) ─────────────────────────────────────
  - package-ecosystem: 'gradle'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'gradle'
    commit-message:
      prefix: 'chore(deps):'
    groups:
      gradle-deps:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'com.android.tools.build:gradle'
        update-types: ['major']
      - dependency-name: 'org.jetbrains.kotlin:kotlin-gradle-plugin'
        update-types: ['major']

  # ── Go modules (libcore) ────────────────────────────────────────
  - package-ecosystem: 'gomod'
    directory: '/libcore'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:30'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'gomod'
    commit-message:
      prefix: 'chore(deps):'
    groups:
      go-deps:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: 'golang.org/x/mobile'
        update-types: ['major']
